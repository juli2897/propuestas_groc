* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--fondo); color:var(--tinta); font-family:var(--texto); font-size:18px; line-height:1.6; -webkit-font-smoothing:antialiased; }
.ink { fill:var(--tinta); } .sol { fill:var(--amarillo); }
.tarjeta { position:relative; min-height:100vh; min-height:100svh; overflow:hidden; display:flex; flex-direction:column;

.logo { height:clamp(44px,6vw,64px); width:auto; display:block; position:relative; z-index:1; }
main { margin:auto 0; padding:32px 0; max-width:1040px; position:relative; z-index:1; }
h1 { font-family:var(--display); font-weight:800; font-size:clamp(40px,5.8vw,84px); line-height:1.06; letter-spacing:-0.025em; margin:0; }
.resalte { background:linear-gradient(to bottom, transparent 0 21%, var(--amarillo) 21% 87%, transparent 87%); padding:0 .1em; -webkit-box-decoration-break:clone; box-decoration-break:clone; }
.antetitulo { font-size:15px; letter-spacing:.14em; text-transform:uppercase; color:var(--tinta-suave); margin:0 0 22px; }
.intro { font-size:clamp(17px,1.6vw,20px); max-width:34em; margin:28px 0 0; }
.guino { font-size:clamp(17px,1.6vw,20px); font-weight:600; margin:10px 0 0; }
.pronto { font-size:16px; color:var(--tinta-suave); margin:14px 0 0; }
.contacto { display:flex; flex-wrap:wrap; align-items:center; gap:14px 22px; position:relative; z-index:1; }
.boton { display:inline-block; font-weight:600; font-size:16px; text-decoration:none; padding:13px 26px; border-radius:999px; background:var(--tinta); color:var(--crema); }
.correo { color:var(--tinta); font-size:16px; }
a:focus-visible { outline:2px solid var(--tinta); outline-offset:3px; border-radius:999px; }
.sol-grande { position:absolute; right:-8vw; bottom:0; width:clamp(220px,38vw,560px); aspect-ratio:2/1; background:var(--amarillo); border-radius:999px 999px 0 0; z-index:0; }
